<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twicaster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Twicaster</h1>
      <p class="subtitle">TwitCasting VOD Downloader</p>
    </header>
    
    <div id="stream-list" class="section">
      <h2>Captured Streams</h2>
      <div id="streams"></div>
      <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
    </div>
    
    <div id="stream-detail" class="section hidden">
      <button id="back-btn" class="btn btn-link">← Back</button>
      <h2 id="stream-title"></h2>
      <p id="stream-url" class="stream-url"></p>
      
      <div class="form-group">
        <label>Quality</label>
        <select id="quality-select">
          <option value="auto">Auto (Highest)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>Start Time</label>
        <div class="time-inputs">
          <input type="text" id="start-seconds" placeholder="Seconds" title="Time in seconds">
          <span class="separator">⇄</span>
          <input type="text" id="start-hhmmss" placeholder="HH:MM:SS" title="Time in HH:MM:SS format">
        </div>
      </div>
      
      <div class="form-group">
        <label>End Time</label>
        <div class="time-inputs">
          <input type="text" id="end-seconds" placeholder="Seconds" title="Time in seconds">
          <span class="separator">⇄</span>
          <input type="text" id="end-hhmmss" placeholder="HH:MM:SS" title="Time in HH:MM:SS format">
        </div>
      </div>
      
      <div class="form-group">
        <label>Duration</label>
        <div id="duration-display" class="duration-display">00:00:00</div>
      </div>
      
      <div class="form-group">
        <label>Output Filename</label>
        <input type="text" id="output-filename" placeholder="video.mp4">
      </div>
      
      <div id="progress-container" class="hidden">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-message" class="progress-message"></p>
      </div>
      
      <button id="download-btn" class="btn btn-primary" disabled>Download</button>
      <p id="error-message" class="error-message hidden"></p>
    </div>
    
    <div id="empty-state" class="hidden">
      <p>No streams captured yet.</p>
      <p>Open a TwitCasting VOD page to capture streams.</p>
    </div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
